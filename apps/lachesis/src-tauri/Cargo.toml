[package]
name = "lepse"
description = "A personal life operating system for top-down \"productivity\"."
authors = ["zorvi"]
repository = "https://github.com/aervxa/lepse"
edition = "2021"
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lepse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.5", features = [ "tray-icon", "image-png", "devtools" ] }
tauri-runtime-wry = { version = "3.0.0-alpha.5", optional = true }
tauri-runtime-cef = { version = "3.0.0-alpha.6", optional = true }
tauri-plugin-log = "3.0.0-alpha.3"
tauri-plugin-os = "3.0.0-alpha.3"
tauri-plugin-store = "3.0.0-alpha.3"
tauri-plugin-opener = "3.0.0-alpha.3"
tauri-plugin-process = "3.0.0-alpha.3"
tauri-plugin-notification = "3.0.0-alpha.3"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "3.0.0-alpha.3"
tauri-plugin-updater = "3.0.0-alpha.3"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = "0.6.0"

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
keyring-core = "1.0.0"
[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"
[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
cef = ["dep:tauri-runtime-cef"]

[patch.crates-io]
tray-icon = { git = "https://github.com/aervxa/tray-icon", rev = "d2212b4baf8556ee0fe3d3ea65966b506f95a2b7" }
