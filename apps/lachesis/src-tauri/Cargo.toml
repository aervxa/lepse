[package]
name = "lepse"
description = "A personal life operating system for top-down \"productivity\"."
authors = ["zorvi"]
repository = "https://github.com/aervxa/lepse"
edition = "2021"
rust-version = "1.93"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lepse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "3.0.0-alpha.2", features = [ "tray-icon", "devtools" ] }
tauri-runtime-wry = { version = "3.0.0-alpha.2", optional = true }
tauri-runtime-cef = { version = "3.0.0-alpha.2", optional = true }
tauri-plugin-log = "3.0.0-alpha.1"
tauri-plugin-os = "3.0.0-alpha.1"
tauri-plugin-store = "3.0.0-alpha.1"
tauri-plugin-opener = "3.0.0-alpha.1"
tauri-plugin-process = "3.0.0-alpha.1"
tauri-plugin-notification = "3.0.0-alpha.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "3.0.0-alpha.1"

[target.'cfg(target_os = "linux")'.dependencies]
oo7 = "0.6.0"

[target.'cfg(not(target_os = "linux"))'.dependencies]
keyring-core = "1.0.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1.0"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "linux", target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust"] }

[features]
default = ["wry"]
wry = ["dep:tauri-runtime-wry"]
cef = ["dep:tauri-runtime-cef"]
